<article>
    <header>
        <h4>{{ out = title }}</h4>
        <p>{{ out = authors }} - {{ out = conference }}</p>
    </header>
    <details>
        <summary><b>Abstract:</b></summary>
        <p>{{ out = abstract }}</p>
    </details>
    <p>
        {{ out = '\n• '.join(f'<a href="{link[0]}">{link[1]}</a>' for link in links) }}
    </p>
</article>
